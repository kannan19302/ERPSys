name: Choreography Bot (M3)

# Per PLATFORM_ARCHITECTURE.md M3
# "A bot that automatically coordinates multi-repo changes via changesets.
# In the polyrepo future, a PR in unierp-contracts will trigger branch creation
# in unierp-api, unierp-web, etc., run their CIs against the new contracts,
# and link the PRs."

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  choreography:
    name: M3 Choreography Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # pnpm must exist before setup-node, not after: `cache: 'pnpm'` shells out
      # to pnpm to locate the store, so ordering these the other way round fails
      # the job at setup with "Unable to locate executable file: pnpm" — before a
      # single line of the bot runs. This job had never executed its own body.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Run Choreography Sync
        run: |
          echo "M3 Choreography bot activated"
          # In the current monorepo phase, this asserts that cross-layer changes
          # have matching versions and valid boundaries.
          #
          # Through `pnpm architecture:check`, not `node scripts/...` directly:
          # the boundary script resolves its baseline relative to the working
          # directory, so invoking it from the repository root exits 1 on a tree
          # that is actually clean. This job named `scripts/ci/check-module-
          # boundaries.mjs`, which is not even where the file lives — two further
          # bugs that the setup-order failure had been hiding, because the job
          # never reached its own body to expose them.
          pnpm install --frozen-lockfile
          pnpm architecture:check
          
          # Check for missing changeset files if L0/L1 is touched.
          #
          # `grep -q` inside an `if` is used deliberately instead of capturing the
          # output with `|| true`. A no-match exit status is normal for grep, but
          # `|| true` is banned repo-wide by the policy gate — it is the exact
          # construct that lets a real failure pass silently, and a gate cannot
          # distinguish a benign use from a harmful one. Testing the status
          # directly needs no suppression at all.
          if git diff --name-only origin/main | grep -q "^packages/contracts"; then
            echo "L0 contracts changed. M3 bot would cross-repo sync this."
            # Enforce changeset exists
            if ! git diff --name-only origin/main | grep -q "^.changeset/"; then
              echo "::error::Changes to packages/contracts require a .changeset file for M3 coordination."
              exit 1
            fi
          fi
