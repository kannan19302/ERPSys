name: Mobile CI

# Phase 0.0 prerequisite (.ai/MULTI_CLIENT_MASTER_PLAN.md § 7): apps/mobile
# builds and analyzes cleanly before any module's cross-platform Parity
# Phase (§ 4) can claim mobile/desktop credit. Android + Windows first (no
# code-signing complexity); iOS/macOS added once Apple signing is set up;
# Linux last.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: apps/mobile

env:
  FLUTTER_VERSION: "3.27.0"

jobs:
  analyze:
    name: Analyze + unit/widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --debug

  build-ios:
    name: Build iOS (no signing)
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --no-codesign --debug

  # macOS/Linux platform folders are not yet scaffolded in apps/mobile
  # (flutter create --platforms=macos,linux . must be run locally — the
  # Flutter SDK isn't available in this repo's sandboxed dev environment).
  # Uncomment these jobs once the platform folders land.
  #
  # build-macos:
  #   name: Build macOS
  #   runs-on: macos-latest
  #   needs: analyze
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         flutter-version: ${{ env.FLUTTER_VERSION }}
  #         channel: stable
  #     - run: flutter pub get
  #     - run: flutter build macos --debug
  #
  # build-linux:
  #   name: Build Linux
  #   runs-on: ubuntu-latest
  #   needs: analyze
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         flutter-version: ${{ env.FLUTTER_VERSION }}
  #         channel: stable
  #     - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
  #     - run: flutter pub get
  #     - run: flutter build linux --debug
